# VibeyRules - switch off Vibey Client features for players on this server.
# All keys and what they do: https://github.com/vibec-studios/vibey-client/blob/main/docs/SERVER-RULES.md
# A key ending in ".*" switches off a whole group (hud.* = every HUD element), "*" alone switches off everything.
# This is a cooperative mechanism for well-behaved clients, not an anti-cheat.

enabled: true

# Features to switch off, e.g.:
#   disable:
#     - zoom
#     - freelook
#     - hud.coords
#     - minimap
disable: []

# Shown to the player once per join (one toast). Leave empty for a generic text.
message: ""

# Optional per-world overrides (world folder names). An entry replaces the global "disable" list in that world
# and, if it sets one, the message.
#   worlds:
#     world_nether:
#       disable: [zoom, hud.*]
#       message: "No zoom and no HUD in the nether."
worlds: {}

# Log which players announce Vibey Client (vibey:hello) and which keys their client supports.
log-hello: true

# Players with the permission vibeyrules.bypass (default: nobody, not even operators) get no rules.
