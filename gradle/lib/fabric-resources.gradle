base { archivesName = "${libId}-fabric-${project.minecraft_label}" }

sourceSets.main.java { exclude '**/mc/neoforge/**' }

processResources {
    exclude 'META-INF/neoforge.mods.toml'
    def props = libResourceProps + [minecraft_range: project.minecraft_range, loader_version: project.loader_version]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand props }
}

loom.runConfigs.configureEach { ideConfigGenerated = false }

if (project.name == gradle.vibeyVcs && rootProject.file("libs/${libId}/src/gametest").isDirectory()) {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = "${libId}-gametest"
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
    sourceSets.named('gametest') {
        java.srcDirs = [rootProject.file("libs/${libId}/src/gametest/java")]
        resources.srcDirs = [rootProject.file("libs/${libId}/src/gametest/resources")]
    }
    dependencies {
        gametestImplementation project.parent
        gradle.vibeyLibs.takeWhile { it != libId }.each { gametestImplementation project.ext.libDep(it) }
    }
}

apply from: rootProject.file('gradle/lib/publish.gradle')
