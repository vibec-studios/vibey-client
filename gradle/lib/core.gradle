// Branch project :<id>: the pure core (src/core) and its JUnit tests (src/test).
apply plugin: 'java-library'

version = project.property("${project.name}_version")
group = project.maven_group
base { archivesName = "${project.name}-core" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

repositories { mavenCentral() }

sourceSets {
    main {
        java.srcDirs = ['src/core/java']
        resources.srcDirs = ['src/core/resources']
    }
    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
    }
}

dependencies {
    project.libDeps.each { api project(":$it") }
    compileOnly "org.joml:joml:${project.joml_version}"
    compileOnly "com.google.code.gson:gson:${project.gson_version}"
    testImplementation "org.joml:joml:${project.joml_version}"
    testImplementation "com.google.code.gson:gson:${project.gson_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '512m'
    testLogging { events 'failed'; exceptionFormat 'full' }
}

apply from: rootProject.file('gradle/lib/core-purity.gradle')
