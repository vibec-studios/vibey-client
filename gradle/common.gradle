version = project.mod_version
group = project.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.ext.javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(project.ext.javaVersion)
}

// Build constants baked into the jar so they can be changed in one place (root gradle.properties).
// The default backend/relay are our services, for official builds only: forks must point them at their own
// (https://github.com/vibec-studios/.github/blob/main/SERVICES.md).
def generatedDir = layout.buildDirectory.dir('generated/vibeyclient')
def genTask = tasks.register('generateBuildInfo') {
    def relay = project.default_relay
    def backend = project.default_backend
    def discord = project.findProperty('discord_app_id') ?: ''
    def ver = project.version.toString()
    def mc = project.minecraft_version
    def label = project.minecraft_label
    inputs.property('relay', relay)
    inputs.property('backend', backend)
    inputs.property('discord', discord)
    inputs.property('version', ver)
    inputs.property('mc', mc)
    inputs.property('label', label)
    outputs.dir(generatedDir)
    doLast {
        def f = generatedDir.get().file('dev/henny/vibeyclient/BuildInfo.java').asFile
        f.parentFile.mkdirs()
        f.text = """package dev.henny.vibeyclient;

/** Generated by gradle/common.gradle. */
public final class BuildInfo {
    public static final String VERSION = "${ver}";
    /** Minecraft version the jar was compiled against. */
    public static final String MINECRAFT = "${mc}";
    /** Minecraft versions the jar is for, e.g. "1.21.6-1.21.8". */
    public static final String MINECRAFT_LABEL = "${label}";
    /** Vibe backend + Vibey relay: official builds only, forks use their own (https://github.com/vibec-studios/.github/blob/main/SERVICES.md). */
    public static final String DEFAULT_BACKEND = "${backend}";
    public static final String DEFAULT_RELAY = "${relay}";
    public static final String DISCORD_APP_ID = "${discord}";
    private BuildInfo() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generatedDir)

apply from: rootProject.file('gradle/modules-filter.gradle')
apply from: rootProject.file('gradle/client-libs.gradle')
apply from: rootProject.file('gradle/client-checks.gradle')
tasks.named('compileJava') { dependsOn genTask }
afterEvaluate {
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn genTask }
}

processResources {
    // The seal logo lives once at the repo root.
    from(rootProject.file('assets/icon.png')) { into 'assets/vibeyclient' }
    // Built-in starter cosmetics/emotes (SPEC section 6): the committed bundles of content/dist, not duplicated in git.
    from(rootProject.file('content/dist')) {
        into 'assets/vibeyclient/builtin'
        include '*.vibey', 'index.json', 'thumbnails/*.png'
    }
}

jar {
    // Apache-2.0 + NOTICE (names, assets, services, third parties) and the MIT notices of the code taken over from
    // Vibey Multiplayer / Vibey Lyrics.
    from(rootProject.file('LICENSE')) { rename { "LICENSE_vibeyclient" } }
    from(rootProject.file('NOTICE')) { rename { "NOTICE_vibeyclient" } }
    from(rootProject.files('licenses/vibey-multiplayer-MIT.txt', 'licenses/vibey-lyrics-MIT.txt')) { into 'licenses/vibeyclient' }
    // The fonts of the lyrics module must travel with their licenses (SIL OFL 1.1 / Apache 2.0).
    if (moduleIncluded('media')) from(rootProject.file('licenses/lyrics')) { into 'licenses/vibeyclient/lyrics' }
}
