// Fabric, Minecraft 26.x (the game ships unobfuscated, no mappings and no remapping).
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

ext.javaVersion = 25
ext.libDep = { String id -> dependencies.project(path: ":${id}:${project.name}") }
ext.libNest = 'include'
apply from: rootProject.file('gradle/common.gradle')

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Pure-Java MP3 decoder (MIT) for the lyrics module, shipped inside the jar (like Vibey Lyrics).
    implementation "fr.delthas:javamp3:${project.javamp3_version}"
    include "fr.delthas:javamp3:${project.javamp3_version}"
}

loom {
    runs {
        client { runDir = 'run'; vmArg "-Dvibeyclient.smoke=${System.getProperty('vibeyclient.smoke', 'false')}" }
        server { runDir = 'run-server'; vmArg "-Dvibeyclient.smoke=${System.getProperty('vibeyclient.smoke', 'false')}" }
    }
}

apply from: rootProject.file('gradle/fabric-resources.gradle')

// Dev tour (dev/DevTour.java): ./gradlew :<target>:runClient -Dvibeyclient.tour=<outdir>
if (System.getProperty('vibeyclient.tour')) loom.runs.named('client') { vmArg "-Dvibeyclient.tour=${System.getProperty('vibeyclient.tour')}" }
// Click self-test (dev/ClickTest.java): ./gradlew :<target>:runClient -Dvibeyclient.clicktest=<outdir>
if (System.getProperty('vibeyclient.clicktest')) loom.runs.named('client') { vmArg "-Dvibeyclient.clicktest=${System.getProperty('vibeyclient.clicktest')}" }
