// Fabric, Minecraft 1.21.x (obfuscated game, compiled with Mojang's official names and remapped by Loom).
plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

ext.javaVersion = 21
apply from: rootProject.file('gradle/common.gradle')

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Pure-Java MP3 decoder (MIT) for the lyrics module, shipped inside the jar (like Vibey Lyrics).
    implementation "fr.delthas:javamp3:${project.javamp3_version}"
    include "fr.delthas:javamp3:${project.javamp3_version}"
}

loom {
    runs {
        // -Dvibeyclient.smoke=true: start, log a marker, quit (see Smoke.java)
        client { runDir = 'run'; vmArg "-Dvibeyclient.smoke=${System.getProperty('vibeyclient.smoke', 'false')}" }
        server { runDir = 'run-server'; vmArg "-Dvibeyclient.smoke=${System.getProperty('vibeyclient.smoke', 'false')}" }
    }
}

apply from: rootProject.file('gradle/fabric-resources.gradle')

// Client game test (only for the version the sources are written in): ./gradlew :fabric-1.21.11:runClientGameTest
if (project.minecraft_version == '1.21.11') {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'vibeyclient-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
    sourceSets.named('gametest') {
        java.srcDirs = [rootProject.file('src/gametest/java')]
        resources.srcDirs = [rootProject.file('src/gametest/resources')]
    }
    // Plain JUnit tests (pure logic such as the signed-loadout check): ./gradlew :fabric-1.21.11:test (part of build).
    // They live in src/junit, not src/test: Stonecutter would hand src/test to every version, which has no JUnit.
    sourceSets.named('test') {
        java.srcDirs = [rootProject.file('src/junit/java')]
        resources.srcDirs = []
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.named('test') {
        useJUnitPlatform()
        maxHeapSize = '512m'
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
    loom.runs.named('clientGameTest') {
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
        // Extra mod jars for the test, e.g. the standalone mods for the conflict test:
        // ./gradlew :fabric-1.21.11:runClientGameTest -Dvibeyclient.test.addMods=<jar>;<jar>  (fabric.addMods syntax)
        def addMods = System.getProperty('vibeyclient.test.addMods', '')
        if (!addMods.isEmpty()) vmArg "-Dfabric.addMods=${addMods}"
        vmArg "-Dvibeyclient.test.relay=${System.getProperty('vibeyclient.test.relay', '127.0.0.1:26400')}"
    }
    // Social test against a local backend: -Dvibeyclient.socialTest=true -Dvibeyclient.devAuth=true
    // -Dvibeyclient.api=http://localhost:3100 -Dvibeyclient.username=VibeyTester (see SocialGameTest)
    ['clientGameTest', 'client'].each { run ->
        loom.runs.named(run) {
            ['vibeyclient.devAuth', 'vibeyclient.api', 'vibeyclient.socialTest', 'vibeyclient.devDriver', 'vibeyclient.devOfflineHost'].each { k ->
                def v = System.getProperty(k)
                if (v != null) vmArg "-D${k}=${v}"
            }
            def user = System.getProperty('vibeyclient.username')
            if (user) programArgs '--username', user
            def dir = System.getProperty('vibeyclient.runDir')
            if (dir && run == 'client') runDir = dir
        }
    }
}

// Dev tour (dev/DevTour.java): ./gradlew :<target>:runClient -Dvibeyclient.tour=<outdir>
if (System.getProperty('vibeyclient.tour')) loom.runs.named('client') { vmArg "-Dvibeyclient.tour=${System.getProperty('vibeyclient.tour')}" }
