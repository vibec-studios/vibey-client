// Fabric, Minecraft 1.21.x (obfuscated game, compiled with Mojang's official names and remapped by Loom).
plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
}

ext.javaVersion = 21
apply from: rootProject.file('gradle/common.gradle')

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Pure-Java MP3 decoder (MIT) for the lyrics module, shipped inside the jar (like Vibey Lyrics).
    implementation "fr.delthas:javamp3:${project.javamp3_version}"
    include "fr.delthas:javamp3:${project.javamp3_version}"
}

loom {
    runs {
        // -Dvibeyclient.smoke=true: start, log a marker, quit (see Smoke.java)
        client { runDir = 'run'; vmArg "-Dvibeyclient.smoke=${System.getProperty('vibeyclient.smoke', 'false')}" }
        server { runDir = 'run-server'; vmArg "-Dvibeyclient.smoke=${System.getProperty('vibeyclient.smoke', 'false')}" }
    }
}

apply from: rootProject.file('gradle/fabric-resources.gradle')

// Client game test (only for the version the sources are written in): ./gradlew :fabric-1.21.11:runClientGameTest
if (project.minecraft_version == '1.21.11') {
    fabricApi {
        configureTests {
            createSourceSet = true
            modId = 'vibeyclient-gametest'
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
    sourceSets.named('gametest') {
        java.srcDirs = [rootProject.file('src/gametest/java')]
        resources.srcDirs = [rootProject.file('src/gametest/resources')]
    }
    loom.runs.named('clientGameTest') {
        vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    }
}
