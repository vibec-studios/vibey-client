// ./gradlew checkI18n – fails when a string is missing in en_us or de_de (part of buildAll).
// Checks: same flattened key set (and the same {n} placeholders) per i18n file in both languages, the vanilla lang
// files (keybind names) in both languages, every literal key passed to Lang.tr/Lang.text/Lang.has/tr in the Java
// sources exists, every module setting has its "setting.<key>" label and every keybind its vanilla name.
import groovy.json.JsonSlurper

tasks.register('checkI18n') {
    group = 'verification'
    description = 'Checks that every user-facing string exists in en_us and de_de.'
    def i18nDir = rootProject.file('src/main/resources/assets/vibeyclient/i18n')
    def langDir = rootProject.file('src/main/resources/assets/vibeyclient/lang')
    def javaDir = rootProject.file('src/main/java')
    inputs.dir(i18nDir)
    inputs.dir(langDir)
    inputs.dir(javaDir)
    doLast {
        def problems = []
        def flatten
        flatten = { Map o, String prefix, Map out ->
            o.each { k, v ->
                def key = prefix ? "${prefix}.${k}" : "${k}"
                if (v instanceof Map) flatten(v, key, out) else out[key] = String.valueOf(v)
            }
            out
        }
        def placeholders = { String s -> (s =~ /\{\d+}/).collect { it }.toSet() }
        def load = { File dir ->
            def m = [:]
            dir.listFiles().findAll { it.name.endsWith('.json') }.each { f ->
                def id = f.name - '.json'
                m[id] = flatten(new JsonSlurper().parse(f, 'UTF-8') as Map, id, [:])
            }
            m
        }
        def en = load(new File(i18nDir, 'en_us'))
        def de = load(new File(i18nDir, 'de_de'))
        def all = [:]
        (en.keySet() + de.keySet()).each { file ->
            def e = en[file], d = de[file]
            if (e == null) { problems << "en_us/${file}.json is missing"; return }
            if (d == null) { problems << "de_de/${file}.json is missing"; return }
            all.putAll(e)
            e.each { k, v ->
                if (!d.containsKey(k)) problems << "de_de: missing ${k}"
                else if (placeholders(v) != placeholders(d[k])) problems << "de_de: placeholders of ${k} differ (${v} / ${d[k]})"
            }
            d.keySet().findAll { !e.containsKey(it) }.each { problems << "en_us: missing ${it} (only in de_de)" }
        }
        def vEn = new JsonSlurper().parse(new File(langDir, 'en_us.json'), 'UTF-8') as Map
        def vDe = new JsonSlurper().parse(new File(langDir, 'de_de.json'), 'UTF-8') as Map
        vEn.keySet().findAll { !vDe.containsKey(it) }.each { problems << "lang/de_de.json: missing ${it}" }
        vDe.keySet().findAll { !vEn.containsKey(it) }.each { problems << "lang/en_us.json: missing ${it}" }

        def files = en.keySet()
        def call = ~/(Lang\.(?:tr|text|has)|(?<![\w.])tr)\(\s*"([A-Za-z0-9_.]+)"/
        def setting = ~/(?<![\w.])(bool|intRange|floatRange|choice|string|color|keybind|action)\(\s*"(\w+)"/
        javaDir.eachFileRecurse { File f ->
            if (!f.name.endsWith('.java')) return
            def src = f.getText('UTF-8')
            def rel = javaDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            def module = (rel =~ /dev\/henny\/vibeyclient\/module\/(\w+)\//)
            def moduleId = module.find() ? module.group(1) : null
            def m = call.matcher(src)
            while (m.find()) {
                String fn = m.group(1), key = m.group(2)
                if (key.endsWith('.')) continue // prefix + computed suffix
                boolean ok
                if (fn.startsWith('Lang.')) ok = all.containsKey(key)
                else ok = all.containsKey(key) || (moduleId && all.containsKey("${moduleId}.${key}".toString())) ||
                        files.any { all.containsKey("${it}.${key}".toString()) }
                if (!ok) problems << "${rel}: ${fn}(\"${key}\") is not in en_us"
            }
            // .section("x") → <module or core>.section.x
            def sec = (src =~ /\.section\(\s*"(\w+)"/)
            def secOwner = moduleId ?: (f.name == 'GlobalSettings.java' ? 'core' : null)
            if (secOwner) {
                while (sec.find()) {
                    def label = "${secOwner}.section.${sec.group(1)}".toString()
                    if (!all.containsKey(label)) problems << "${rel}: section title ${label} is not in en_us"
                }
            }
            if (moduleId && f.name.endsWith('Module.java')) {
                def s = setting.matcher(src)
                while (s.find()) {
                    def label = "${moduleId}.setting.${s.group(2)}".toString()
                    if (!all.containsKey(label)) problems << "${rel}: setting label ${label} is not in en_us"
                    if (s.group(1) == 'keybind') {
                        def name = "key.vibeyclient.${moduleId}.${s.group(2)}".toString()
                        if (!vEn.containsKey(name)) problems << "${rel}: keybind name ${name} is not in lang/en_us.json"
                    }
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("i18n check failed (${problems.size()}):\n  " + problems.join('\n  '))
        }
        println "i18n ok: ${files.size()} files, ${all.size()} keys in en_us and de_de"
    }
}
