// NeoForge (Mojang's names at runtime, nothing to remap).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

ext.javaVersion = project.minecraft_version.startsWith('1.') ? 21 : 25
apply from: rootProject.file('gradle/common.gradle')

base { archivesName = "${project.archives_base_name}-neoforge-${project.minecraft_label}" }

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    enable {
        version = project.neo_version
        // We only need the game classes, not a decompiled copy: much faster setup.
        disableRecompilation = true
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'vibeyclient.smoke', System.getProperty('vibeyclient.smoke', 'false')
            // Multiplayer module visual check (dev only, see MpDevCheck): -Dvibeyclient.mpcheck=true [-Dvibeyclient.mpcheck.relay=127.0.0.1:26400]
            systemProperty 'vibeyclient.mpcheck', System.getProperty('vibeyclient.mpcheck', 'false')
            systemProperty 'vibeyclient.mpcheck.relay', System.getProperty('vibeyclient.mpcheck.relay', '')
            // Social against a local backend (see SocialGameTest): -Dvibeyclient.devAuth=true -Dvibeyclient.api=...
            ['vibeyclient.devAuth', 'vibeyclient.api'].each { k ->
                def v = System.getProperty(k)
                if (v != null) systemProperty k, v
            }
            def user = System.getProperty('vibeyclient.username')
            if (user) programArguments.addAll('--username', user)
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'vibeyclient.smoke', System.getProperty('vibeyclient.smoke', 'false')
        }
    }
    mods {
        vibeyclient { sourceSet(sourceSets.main) }
    }
}

// Fabric entry points and the Fabric-only lyrics module are not part of the NeoForge jar.
sourceSets.main.java {
    exclude 'dev/henny/vibeyclient/fabric/**'
    exclude 'dev/henny/vibeyclient/module/media/**'
}

processResources {
    exclude 'fabric.mod.json'
    exclude 'vibeyclient.media.lyrics.mixins.json'
    exclude 'assets/vibeyclient/i18n/*/media*.json'
    exclude 'assets/vibeyclient/font/lyrics/**', 'assets/vibeyclient/textures/lyrics/**', 'assets/vibeyclient/lyrics/**'
    def props = [
            version            : project.version,
            mod_id             : project.mod_id,
            mod_name           : project.mod_name,
            neo_range          : project.neo_range,
            minecraft_neo_range: project.minecraft_neo_range,
            // NeoForge 26.3 warns on every start about the deprecated logoFile (square icons: iconFile)
            neo_logo_key       : project.findProperty('neo_logo_key') ?: 'logoFile',
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

// Dev tour (dev/DevTour.java): ./gradlew :<target>:runClient -Dvibeyclient.tour=<outdir>
if (System.getProperty('vibeyclient.tour')) neoForge.runs.named('client') { systemProperty 'vibeyclient.tour', System.getProperty('vibeyclient.tour') }
