org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.problems.report=false

mod_id=vibeyclient
mod_name=Vibey Client
mod_version=0.3.1
maven_group=dev.henny
archives_base_name=vibey-client

# Baked into BuildInfo. Players can change the backend under Global settings > Advanced.
# Official builds only: forks must use their own backend and relay, see
# https://github.com/vibec-studios/.github/blob/main/SERVICES.md
default_backend=https://vibe.axolite.app
# Same default relay as Vibey Multiplayer (used by the multiplayer module). Official builds only, see
# https://github.com/vibec-studios/.github/blob/main/SERVICES.md
default_relay=relay.axolite.cc:25565
# Discord Rich Presence application id (social module, docs/SOCIAL.md). Official builds only: forks register their
# own application at https://discord.com/developers. Empty = no Rich Presence. Dev runs: -Dvibeyclient.discordAppId=...
discord_app_id=

# Pure-Java MP3 decoder (MIT) used by the lyrics module (Fabric only), shipped inside the jar.
javamp3_version=1.0.1

# Video screens (Fabric 1.21.11 only): the optional browser mod we compile against (never bundled, LGPL-2.1)
mcef_modern_version=0.3.3+mc1.21.11.jcef146.0.10
jcef_api_version=jcef-d3de827+cef-146.0.10+g8219561+chromium-146.0.7680.179

# Libraries in libs/ (own mods, shipped inside the client jar), see libs/README.md
vui_version=0.1.0
r3_version=0.1.0
cosmetico_version=0.1.0
# Lowest versions any target's Minecraft ships; lib cores compile against these
joml_version=1.10.8
gson_version=2.11.0
junit_version=5.11.4
