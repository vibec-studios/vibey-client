org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=false
org.gradle.problems.report=false

mod_id=vibeyclient
mod_name=Vibey Client
mod_version=0.2.0
maven_group=dev.henny
archives_base_name=vibey-client

# Baked into BuildInfo. Players can change the backend under Global settings > Advanced.
# Official builds only: forks must use their own backend and relay, see SERVICES.md.
default_backend=https://vibe.henny.dev
# Same default relay as Vibey Multiplayer (used by the multiplayer module). Official builds only, see SERVICES.md.
default_relay=relay.vibey.henny.dev:25565

# Pure-Java MP3 decoder (MIT) used by the lyrics module (Fabric only), shipped inside the jar.
javamp3_version=1.0.1
