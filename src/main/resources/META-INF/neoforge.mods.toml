modLoader = "javafml"
loaderVersion = "[1,)"
license = "Apache-2.0 (code); artwork all rights reserved, see NOTICE"
issueTrackerURL = "https://github.com/vibec-studios/vibey-client/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
${neo_logo_key} = "assets/vibeyclient/icon.png"
authors = "Vibe Craft Studios"
displayURL = "https://github.com/vibec-studios/vibey-client"
description = """The Vibe Craft Studios client: social, cosmetics, emotes, multiplayer hosting and lyrics in one modular mod."""

[[mixins]]
config = "vibeyclient.mixins.json"

[[mixins]]
config = "vibeyclient.social.mixins.json"

[[mixins]]
config = "vibeyclient.cosmetics.mixins.json"

[[mixins]]
config = "vibeyclient.emotes.mixins.json"

[[mixins]]
config = "vibeyclient.multiplayer.mixins.json"

[[mixins]]
config = "vibeyclient.devlink.mixins.json"

[[mixins]]
config = "vibeyclient.nametags.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "vui"
type = "required"
versionRange = "[${vui_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "r3"
type = "required"
versionRange = "[${r3_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cosmetico"
type = "required"
versionRange = "[${cosmetico_version},)"
ordering = "AFTER"
side = "BOTH"
