name: Release

# Builds every jar + the Blockbench plugin for a version tag and attaches them to the GitHub release together with
# `vibey-manifest.json` (VIBE-API-2 §2 manifest plus sha256 and size of every file). The Vibe backend imports
# releases from GitHub itself; this workflow never talks to vibe.henny.dev (Cloudflare blocks GitHub runners there).
# Manual fallback without GitHub: `node tools/release-manifest.mjs --publish …` from your machine (README "Releases").
#
# Cut a release: bump mod_version (gradle.properties) and blockbench/package.json + VERSION in blockbench/vibey.js,
# add a "## <version>" section to CHANGELOG.md, merge to main, then publish a GitHub release with tag v<version>
# (the release text becomes the changelog; empty = the CHANGELOG.md section). A GitHub pre-release or a tag with a
# "-" suffix (v0.3.0-beta.1) goes to the beta channel. Pushing a v* tag without a release creates the release.
# Re-running replaces the assets (--clobber); vibey-manifest.json is uploaded last, once every file it lists is there.

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

concurrency:
  # one run per tag; a release event and its tag push must not upload at the same time
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and attach to the GitHub release
    runs-on: ubuntu-latest # free GitHub-hosted runner
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # 1.21.x builds with Java 21, 26.x needs Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the version before building
        run: |
          node --test tools/release-manifest.test.mjs
          v="${TAG#v}"
          mod="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          if [ "${v%%-*}" != "${mod%%-*}" ]; then echo "::error::tag $TAG does not match mod_version $mod"; exit 1; fi

      - name: Build all jars
        run: >
          ./gradlew buildAll --stacktrace
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      # Paper/Spigot plugin (docs/SERVER-RULES.md): its own small build, attached as VibeyRules-<version>.jar.
      # Kept out of build/dist on purpose: the manifest only lists the mod jars.
      - name: VibeyRules server plugin
        run: >
          ./gradlew -p server-plugins/vibey-rules build --stacktrace
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Blockbench plugin tests
        working-directory: blockbench
        run: |
          npm ci || npm install
          npm test

      - name: Release notes and channel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BODY: ${{ github.event.release.body }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          mkdir -p build/release
          if [ -n "$EVENT_BODY" ]; then
            printf '%s\n' "$EVENT_BODY" > build/release/notes.md
          else
            gh release view "$TAG" --json body --jq .body > build/release/notes.md 2>/dev/null || : > build/release/notes.md
          fi
          # beta = GitHub pre-release (event or existing release) or a tag with a "-" suffix
          pre=false
          [ "$EVENT_PRERELEASE" = "true" ] && pre=true
          case "$TAG" in *-*) pre=true;; esac
          [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null)" = "true" ] && pre=true
          echo "PRERELEASE=$pre" >> "$GITHUB_ENV"

      - name: Manifest (vibey-manifest.json)
        run: |
          # vibey.js must be the committed LF bytes (the manifest hashes it; the tool refuses CRLF)
          flag=""; [ "$PRERELEASE" = "true" ] && flag="--prerelease"
          node tools/release-manifest.mjs --tag "$TAG" --changelog-file build/release/notes.md --hashes $flag \
            --out build/release/vibey-manifest.json
          node -e "const m=require('./build/release/vibey-manifest.json');console.log(m.version,m.channel,m.files.length+' jars')"

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(build/dist/*.jar blockbench/vibey.js server-plugins/vibey-rules/build/libs/VibeyRules-*.jar)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # tag pushed without a release: create it with the changelog section
            node -e "const m=require('./build/release/vibey-manifest.json');require('fs').writeFileSync('build/release/body.md',m.changelog)"
            prerelease_flag=""; [ "$PRERELEASE" = "true" ] && prerelease_flag="--prerelease"
            gh release create "$TAG" "${files[@]}" --title "Vibey Client ${TAG#v}" --notes-file build/release/body.md $prerelease_flag
          fi
          # last: the manifest marks the release as complete for the backend importer
          gh release upload "$TAG" build/release/vibey-manifest.json --clobber
