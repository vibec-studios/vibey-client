name: Build

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mod:
    name: Mod (all Minecraft versions)
    # Free GitHub-hosted runner, no paid services.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 1.21.x builds with Java 21, 26.x needs Java 25. The last one listed becomes JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all jars
        run: >
          ./gradlew buildAll --stacktrace
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - uses: actions/upload-artifact@v4
        with:
          name: vibey-client-jars
          path: build/dist/*.jar
          if-no-files-found: error

  server-plugin:
    name: VibeyRules server plugin (Paper/Spigot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the plugin
        run: ./gradlew -p server-plugins/vibey-rules build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vibey-rules-plugin
          path: server-plugins/vibey-rules/build/libs/VibeyRules-*.jar
          if-no-files-found: error

  relay:
    name: Hosting against the real relay
    # Hosts with exactly the client's hello against the relay from vibey-multiplayer's main branch (RelayHostTest).
    # Catches relay changes that reject the Vibey Client (relay 1.3.0 answered "Invalid client.").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vibec-studios/vibey-multiplayer
          ref: main
          path: vibey-multiplayer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the relay (offline mode, no backend)
        run: |
          mkdir -p "$RUNNER_TEMP/relay-data"
          cd vibey-multiplayer/relay
          ALLOW_OFFLINE=1 PORT=26400 DATA_DIR="$RUNNER_TEMP/relay-data" DOMAIN=vibey.test nohup node src/main.ts > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/26400) 2>/dev/null && exit 0; sleep 0.2; done
          cat "$RUNNER_TEMP/relay.log"; exit 1
      - name: Host against it
        env:
          VIBEY_TEST_RELAY: 127.0.0.1:26400
        run: >
          ./gradlew :fabric-1.21.11:test --tests '*RelayHostTest*' --stacktrace
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Relay log
        if: always()
        run: cat "$RUNNER_TEMP/relay.log" || true

  blockbench:
    name: Blockbench plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        working-directory: blockbench
        run: |
          npm ci || npm install
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: vibey-blockbench-plugin
          path: blockbench/vibey.js

  content:
    name: Starter content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild and check that dist is up to date
        working-directory: content
        run: |
          npm ci || npm install
          npm run build
          git diff --stat --exit-code -- dist/*.vibey dist/index.json
